name: craft-suite
services:
  desktop:
    image: ${ARTCRAFT_IMAGE:-60plus/artcraft:latest}
    container_name: craft-suite
    restart: unless-stopped
    shm_size: 2gb
    runtime: nvidia
    gpus: all
    devices:
      - /dev/dri:/dev/dri
      - /dev/nvidia-modeset:/dev/nvidia-modeset
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      CUSTOM_USER: ${CUSTOM_USER:-craft}
      PASSWORD: ${PASSWORD:?Set a desktop password in .env}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      WGPU_BACKEND: vulkan
      CRAFT_APP: ${CRAFT_APP:-artcraft-launcher}
      TITLE: Craft Suite
      # Follow the browser viewport in CSS pixels without a HiDPI multiplier.
      SELKIES_MANUAL_RESOLUTION: "false|locked"
      SELKIES_ENABLE_RESIZE: "true|locked"
      SELKIES_USE_CSS_SCALING: "true|locked"
      SELKIES_SCALING_DPI: "96"
      SELKIES_FRAMERATE: "60,30-60"
      # Avoid a two-second WebSocket frame backlog.
      SELKIES_BACKPRESSURE_QUEUE_SIZE: "8"
      SELKIES_RATE_CONTROL_MODE: cbr
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-3443}:3001"
    volumes:
      - type: bind
        source: ${APP_DATA_DIR:-./data/config}
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ${PROJECTS_DIR:-./data/projects}
        target: /projects
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, 'code=$$(curl -ks -o /dev/null -w "%{http_code}" https://127.0.0.1:3001/); test "$$code" = 200 || test "$$code" = 401']
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
